# Default hyper-parameters for bt4rec.cli.build_tree (override with env vars / EXTRA_ARGS in scripts/03_build_tree.sh)
num_clusters: 50
cluster_mode: global              # constrained = mechanism-constraint ablation (see constraint_level)
constraint_level: mechanism       # used only with cluster_mode: constrained
confidence_filter: false          # true = reject low similarity / margin assignments (ablation)
cluster_text_field: structured_combined
embedding_model: Qwen/Qwen3-Embedding-0.6B
min_cluster_similarity: 0.55      # used only with confidence_filter: true
min_cluster_margin: 0.02          # used only with confidence_filter: true
max_order: 5
count_mode: user_normalized       # occurrence = no per-user normalisation (ablation)
smoothing_kappa: 5.0
min_support_users: 3
min_support_occurrences: 3
min_jsd: 0.05
label_assignment: cosine
state_signature: medoid
collapse_consecutive_states: false
